<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS – Beach Moments</title>
  <meta name="description" content="DS – Elegante private Galerie mit Strandmomenten von Côte d'Azur, Knokke, Katwijk und der Nordsee. Fullscreen 3D Coverflow Slider.">
  <meta name="keywords" content="DS, Strand, Beach, Côte d'Azur, Knokke, Katwijk, Nordsee, Galerie, Privat">
  <meta name="author" content="DS">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="DS – Beach Moments">
  <meta property="og:description" content="Elegante private Galerie mit Strandmomenten. Fullscreen 3D Coverflow.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="data:image/png;base64,PLACEHOLDER_FAV">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #f5f5f5; }
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 18px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent); pointer-events: none; }
    .logo-wrap { pointer-events: auto; display: flex; align-items: center; gap: 12px; }
    #header-logo { height: 80px; width: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }
    .swiper { width: 100%; height: 100%; }
    .swiper-slide { background-size: cover; background-position: center; }
    .swiper-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .site-footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; text-align: center; padding: 24px 20px 28px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); pointer-events: none; }
    .footer-inner { pointer-events: auto; max-width: 520px; margin: 0 auto; }
    .footer-inner h2 { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 10px; }
    .footer-inner p { font-size: 0.9rem; line-height: 1.55; color: rgba(255,255,255,0.85); margin-bottom: 8px; }
    .footer-inner a { color: #e8d5b5; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    .footer-inner a:hover { border-bottom-color: #e8d5b5; }
    .email-icon { display: inline-block; vertical-align: middle; margin-right: 6px; width: 16px; height: 16px; }
    @media (max-width: 600px) { #header-logo { height: 56px; } .site-header { padding: 12px; } .site-footer { padding-bottom: 20px; } }
  </style>
</head>
<body ng-app="panoramaApp" ng-controller="MainController as vm">
  <header class="site-header">
    <div class="logo-wrap" aria-label="DS">
      <img id="header-logo" alt="DS Greif Wappen" src="data:image/png;base64,PLACEHOLDER_LOGO">
    </div>
  </header>

  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide" ng-repeat="img in vm.images track by $index">
        <img ng-src="{{img}}" alt="Strandmoment">
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <h2>Impressum</h2>
      <p>Private Website · Persönliche Strandmomente</p>
      <p style="margin-top:14px;"><strong>Kontakt</strong></p>
      <p>Schön, dass du vorbeigeschaut hast. Bei Fragen oder Anmerkungen schreib gerne eine kurze Nachricht.</p>
      <p style="margin-top:8px;">
        <svg class="email-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
        <a href="mailto:kontakt@ds-moments.de">kontakt@ds-moments.de</a>
      </p>
    </div>
  </footer>

  <script>
    angular.module('panoramaApp', [])
      .controller('MainController', function() {
        var vm = this;
        var sources = [
          'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80',
          'https://images.unsplash.com/photo-1506929562872-bb421503ef21?w=1920&q=80',
          'https://images.unsplash.com/photo-1473116763249-2faaef81ccda?w=1920&q=80',
          'https://images.unsplash.com/photo-1519046904884-53103b34b206?w=1920&q=80',
          'https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=1920&q=80',
          'https://images.unsplash.com/photo-1471922694854-ff1b63b20054?w=1920&q=80'
        ];
        function shuffle(a) {
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }
        vm.images = shuffle(sources.slice());
      });

    document.addEventListener('DOMContentLoaded', function() {
      new Swiper('.swiper', {
        effect: 'coverflow',
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: 'auto',
        coverflowEffect: {
          rotate: 45,
          stretch: 0,
          depth: 200,
          modifier: 1,
          slideShadows: true
        },
        autoplay: {
          delay: 5000,
          disableOnInteraction: false
        },
        loop: true,
        speed: 900
      });
    });
  </script>
</body>
</html>
